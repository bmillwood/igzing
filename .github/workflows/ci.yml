on:
  push:
    branches: [main]
  pull_request:

env:
  nixpkgs_version: 2786a2a72088ecf32aea5b3ec52099e6a7cff78f # renovate: datasource=git-refs depName=NixOS/nixpkgs packageName=https://github.com/NixOS/nixpkgs currentValue=nixos-unstable

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.nixpkgs_version }}.tar.gz
      - run: nix-build -A site
      - run: nix-shell --run 'cd frontend && elm-test'
      - run: nix-shell --run 'pytest e2e'

      # Pull requests hand their build to pages.yml, which deploys main along
      # with every open preview. (It skips builds from forks.)
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-pr-${{ github.event.number }}
          path: result/
          retention-days: 14

      # Only on opened: the URL doesn't change as the branch is pushed to.
      - if: github.event.action == 'opened'
        run: |
          page_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Preview of this branch: ${page_url}pr/$NUMBER/ (live once the Pages deploy finishes)"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.number }}
