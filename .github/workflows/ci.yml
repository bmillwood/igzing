on:
  push:
    branches: [main]
  pull_request:

env:
  nixpkgs_version: 2786a2a72088ecf32aea5b3ec52099e6a7cff78f # renovate: datasource=git-refs depName=NixOS/nixpkgs packageName=https://github.com/NixOS/nixpkgs currentValue=nixos-unstable

jobs:
  build:
    # this environment contains the cachix signing key and auth token
    environment: ${{ github.ref == 'refs/heads/main' && 'default-branch' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.nixpkgs_version }}.tar.gz
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: bmillwood
          # if not on the env with these secrets, they'll just be empty, which is fine
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix-build -A site
      - run: nix-shell --run 'cd frontend && elm-test'
      - run: nix-shell --run 'pytest e2e'

      # Pull requests hand their build to pages.yml, which deploys main along
      # with every open preview. (It skips builds from forks.)
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-pr-${{ github.event.number }}
          path: result/
          retention-days: 14

  # Compares the site with its base, in before and after screenshots and a
  # report of how the game's data changed, for pages.yml to put in the
  # preview's compare/. A separate job so as to run alongside the tests.
  compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A pull request's checkout is a merge into the base branch, whose own
      # tip is then the first parent: the build to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.nixpkgs_version }}.tar.gz
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: bmillwood
      - run: git worktree add ../base HEAD^1
      - run: nix-build -A site
      # With the base's own nixpkgs, so that bumping it shows up as a change.
      - run: |
          base_nixpkgs=$(yq -r .env.nixpkgs_version ../base/.github/workflows/ci.yml)
          nix-build ../base -A site -o result-base \
            -I "nixpkgs=https://github.com/NixOS/nixpkgs/archive/$base_nixpkgs.tar.gz"
      - run: nix-shell --run 'python e2e/screenshots.py --site result --base result-base --out compare/screenshots'
      # In full, and shortened for pages.yml's comment on the pull request.
      - run: nix-shell --run 'PYTHONPATH=pipeline python -m igzing_data diff --base result-base/data --this result/data > compare/data.txt'
      - run: nix-shell --run 'PYTHONPATH=pipeline python -m igzing_data diff --base result-base/data --this result/data --limit 20 > compare/data-short.md'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compare-pr-${{ github.event.number }}
          path: compare/
          retention-days: 14
