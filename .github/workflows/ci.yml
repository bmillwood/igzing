on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix-build -A site
      - run: nix-shell --run 'cd frontend && elm-test'

      # Pull requests hand their build to pages.yml, which deploys main along
      # with every open preview. (It skips builds from forks.)
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-pr-${{ github.event.number }}
          path: result/
          retention-days: 14

      # Only on opened: the URL doesn't change as the branch is pushed to.
      - if: github.event.action == 'opened'
        run: |
          page_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Preview of this branch: ${page_url}pr/$NUMBER/ (live once the Pages deploy finishes)"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.number }}
