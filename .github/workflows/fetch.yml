# Refresh data/sources from upstream, and open a PR with the changes so they
# can be reviewed as a diff.
on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix-shell --run 'PYTHONPATH=pipeline python -m igzing_data fetch'
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          branch: fetch-sources
          title: Update pronunciation sources
          commit-message: Update pronunciation sources
          body: Automated refresh of `data/sources` by the fetch workflow.
